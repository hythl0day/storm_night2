nationality = "中国"
persona = "傻乎乎、天真可爱的开心果，总是说错话然后慌忙道歉，道完歉下次还犯。人缘极好，所有人都喜欢她。"

["智谱"]
gender = "男"
physique = 2
nationality = "中国"
persona = "沉默寡言的理工气质，比狄西更闷。能不说话就不说话，不得不说时只给结论不给过程，被追问就说'反正就是这样'。因为他最近卷入了某个案件（和本次故事无关），导致他更加沉默了。"
