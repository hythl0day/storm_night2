# 《暴风夜》玩家席位配置
# 复制本文件为 players.toml 后填入你的接口信息。
# 安全约定：api_key 不落盘，这里只填【环境变量名】，程序运行时读取真实 key。

[settings]
# temperature 不发送：全席统一走渠道默认值（部分上游只接受默认温度），不要在此配置
max_tokens = 131072 # 全席统一单次输出上限（输出预算，不是上下文窗口）；可在单个席位里同名覆盖

# ---- 国外中转站 4 家 ----

# api_type 可选 "openai"（默认）或 "anthropic"（Claude 原生 /v1/messages 协议）

[[player]]
id = 'gpt'
name = "索尔·杰普特"       # ChatGPT
model = "gpt-6.1-sol"           # TODO: 改成你中转站里的实际模型名
base_url = "https://apinebula.ai/v1"
api_key_env = "RELAY_API_KEY_GPT"
api_type = "openai"

[[player]]
id = 'claude'
name = "桑娜·克劳德"       # Claude
model = "claude-sonnet-5-5"   # TODO
base_url = "https://apinebula.ai/v1"   # 该站 Claude 兼容 openai 格式，统一走 /v1/chat/completions
api_key_env = "RELAY_API_KEY_CLAUDE"
api_type = "openai"

