# 《暴风夜》玩家席位配置
# 复制本文件为 players.toml 后填入你的接口信息。
# 安全约定：api_key 不落盘，这里只填【环境变量名】，程序运行时读取真实 key。

[settings]
temperature = 0.8   # 六席统一采样温度，保证公平

# ---- 国外中转站 4 家 ----

# api_type 可选 "openai"（默认）或 "anthropic"（Claude 原生 /v1/messages 协议）

[[player]]
name = "索尔·杰普特"       # ChatGPT
model = "gpt-6.1-sol"           # TODO: 改成你中转站里的实际模型名
base_url = "https://apinebula.ai/v1"
api_key_env = "RELAY_API_KEY_GPT"
api_type = "openai"

[[player]]
name = "桑娜·克劳德"       # Claude
model = "claude-sonnet-5-5"   # TODO
base_url = "https://apinebula.ai"   # 走原生协议；若中转站支持 anthropic 转发则改成中转站地址
api_key_env = "RELAY_API_KEY_CLAUDE"
api_type = "anthropic"

[[player]]
name = "杰米娜"     # Gemini
model = "gemini-3.8-flash"      # TODO
base_url = "https://apinebula.ai/v1"
api_key_env = "RELAY_API_KEY_GEMINI"
api_type = "openai"

[[player]]
