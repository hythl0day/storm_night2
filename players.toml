# 《暴风夜》玩家席位配置
# 本文件随仓库跟踪分发（只含接口地址与环境变量名，无密钥）。
# 安全约定：api_key 不落盘，这里只填【环境变量名】，程序运行时读取真实 key。

[settings]
# temperature 不发送：全席统一走渠道默认值（部分上游只接受默认温度），不要在此配置
max_tokens = 16384 # 失控安全网（正常回复 1-2K token，远触不到；篇幅约束在 prompt/game_system.md）；可在单个席位里同名覆盖
# 全席统一思考强度 low（压隐藏思考耗时；bench --effort 实测 7/8 渠道兼容）。席位可覆盖；填 "none" = 不发该参数
reasoning_effort = "low"

# ---- 国外中转站 4 家 ----

# api_type 可选 "openai"（默认）或 "anthropic"（Claude 原生 /v1/messages 协议）

[[player]]
id = 'gpt'
name = "索尔·杰普特"       # ChatGPT
model = "gpt-6.1-sol"
base_url = "https://api.apinebula.ai/v1"
api_key_env = "RELAY_API_KEY_GPT"

[[player]]
id = 'claude'
name = "桑娜·克劳德"       # Claude
model = "claude-sonnet-5-5"
base_url = "https://api.apinebula.ai/v1"
api_key_env = "RELAY_API_KEY_CLAUDE"
api_type = "openai"
reasoning_effort = "none"   # 上游只支持 adaptive/between_tools 思考模式，budget/effort 一律 400；实测 anthropic 协议 + adaptive 被断连，故例外不设档

[[player]]
